name: Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: ".exe"
            suffix: "windows-amd64"
          - os: ubuntu-latest
            ext: ""
            suffix: "linux-amd64"
          - os: macos-14 # Specifically pins to Apple Silicon (M-series) runner
            ext: ""
            suffix: "macos-arm64"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Linux dependencies (including wgpu requirements)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Compiling the individual crates explicitly
      - name: Build Release Binaries
        run: |
          cargo build --release -p manifold-gui
          cargo build --release -p manifold-cli

      # Group, rename, and stage the files for deployment
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir dist

          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: GUI .app bundle as .zip, CLI as .tar.gz
            bash scripts/build-macos-app.sh --release --zip
            cp target/release/Manifold-macos-app.zip "dist/manifold-gui-${{ matrix.suffix }}.zip"
            tar -czf "dist/manifold-cli-${{ matrix.suffix }}.tar.gz" -C target/release manifold
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: Zip executables
            7z a "dist/manifold-gui-${{ matrix.suffix }}.zip" ./target/release/manifold-gui.exe
            7z a "dist/manifold-cli-${{ matrix.suffix }}.zip" ./target/release/manifold.exe
          else
            # Linux: gzip (tar.gz) executables to preserve permissions
            tar -czf "dist/manifold-gui-${{ matrix.suffix }}.tar.gz" -C target/release manifold-gui
            tar -czf "dist/manifold-cli-${{ matrix.suffix }}.tar.gz" -C target/release manifold
          fi

          # Generate SHA-256 checksums inside the dist directory
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              if command -v shasum &> /dev/null; then
                shasum -a 256 "$file" > "$file.sha256"
              else
                sha256sum "$file" > "$file.sha256"
              fi
            fi
          done

      # Uploads both artifacts simultaneously to the GitHub Release page
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
