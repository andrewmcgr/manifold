name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon & App Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install opencascade openvdb tbb cmake pkg-config

      - name: Run unit and integration test suite
        run: |
          cargo test --manifest-path frontend/Cargo.toml

      - name: Build macOS application bundle (Manifold.app)
        run: |
          chmod +x scripts/bundle_macos.sh
          ./scripts/bundle_macos.sh --release

      - name: Verify Manifold.app structure and headless slicing
        run: |
          APP_BUNDLE="target/release/bundle/osx/Manifold.app"
          test -d "${APP_BUNDLE}"
          test -x "${APP_BUNDLE}/Contents/MacOS/manifold-frontend"
          test -f "${APP_BUNDLE}/Contents/Resources/Manifold.icns"
          test -f "${APP_BUNDLE}/Contents/Info.plist"
          "${APP_BUNDLE}/Contents/MacOS/manifold-frontend" --help
          "${APP_BUNDLE}/Contents/MacOS/manifold-frontend" slice "Test Objects/Manifold_M_Cube.3mf" -o /tmp/manifold_macos_ci.gcode
          test -s /tmp/manifold_macos_ci.gcode

      - name: Package Manifold.app zip artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/osx/Manifold.app \
            target/release/bundle/osx/Manifold-macos-arm64.zip

      - name: Upload macOS Manifold.app artifact
        uses: actions/upload-artifact@v6
        with:
          name: Manifold-macos-arm64
          path: target/release/bundle/osx/Manifold-macos-arm64.zip

  linux:
    name: Linux (Ubuntu 24.04 Build, Test & Package)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system CAD, OpenVDB, and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libopenvdb-dev \
            libtbb-dev \
            libimath-dev \
            libboost-iostreams-dev \
            libboost-system-dev \
            libblosc-dev \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libgtk-3-dev

      - name: Run unit and integration test suite
        env:
          MANIFOLD_DISABLE_GPU: "1"
        run: |
          cargo test --manifest-path frontend/Cargo.toml

      - name: Build and package Linux release
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh --release

      - name: Verify Linux package and headless slicing
        env:
          MANIFOLD_DISABLE_GPU: "1"
        run: |
          STAGE_DIR="target/release/package/manifold-linux"
          test -x "${STAGE_DIR}/bin/manifold-frontend"
          test -L "${STAGE_DIR}/bin/manifold"
          test -f "${STAGE_DIR}/share/applications/manifold.desktop"
          test -f "${STAGE_DIR}/share/icons/hicolor/256x256/apps/manifold.png"
          "${STAGE_DIR}/bin/manifold-frontend" --help
          "${STAGE_DIR}/bin/manifold-frontend" slice "Test Objects/Manifold_M_Cube.3mf" -o /tmp/manifold_linux_ci.gcode
          test -s /tmp/manifold_linux_ci.gcode

      - name: Upload Linux release tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: Manifold-linux-x86_64
          path: target/release/package/manifold-linux.tar.gz

  windows:
    name: Windows (x86_64 Build, Test & Scoop Bundle)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSYS2 UCRT64 with OpenCASCADE, OpenVDB, TBB, and GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-openvdb
            mingw-w64-ucrt-x86_64-tbb
            mingw-w64-ucrt-x86_64-imath
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-blosc

      - name: Install Rust toolchain (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Configure Cargo to default to x86_64-pc-windows-gnu
        run: |
          mkdir -p .cargo
          printf '[build]\ntarget = "x86_64-pc-windows-gnu"\n' > .cargo/config.toml

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run unit and integration test suite
        env:
          MANIFOLD_DISABLE_GPU: "1"
        run: |
          export PATH="$HOME/.cargo/bin:/c/Users/runneradmin/.cargo/bin:$PATH"
          export MANIFOLD_DEPS_PREFIX="$(cygpath -w "$MINGW_PREFIX")"
          cargo test --manifest-path frontend/Cargo.toml

      - name: Build and package Windows Scoop bundle
        run: |
          export PATH="$HOME/.cargo/bin:/c/Users/runneradmin/.cargo/bin:$PATH"
          export MANIFOLD_DEPS_PREFIX="$(cygpath -w "$MINGW_PREFIX")"
          pwsh -NoProfile -File scripts/package_windows.ps1 -Profile release -BinDir "target/x86_64-pc-windows-gnu/release"

      - name: Verify self-contained Windows bundle and headless slicing
        shell: pwsh
        env:
          MANIFOLD_DISABLE_GPU: "1"
        run: |
          $StageDir = "target\release\package\manifold-windows-x86_64"
          if (-not (Test-Path "$StageDir\manifold-frontend.exe")) { throw "Missing manifold-frontend.exe" }
          if (-not (Test-Path "$StageDir\manifold.exe")) { throw "Missing manifold.exe" }
          & "$StageDir\manifold-frontend.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          & "$StageDir\manifold-frontend.exe" slice "Test Objects\Manifold_M_Cube.3mf" -o "$env:TEMP\manifold_win_ci.gcode"
          if ($LASTEXITCODE -ne 0) { throw "Headless slice failed" }
          if ((Get-Item "$env:TEMP\manifold_win_ci.gcode").Length -eq 0) { throw "Empty G-code output" }

      - name: Upload Windows Scoop zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: Manifold-windows-x86_64
          path: target/release/package/manifold-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: Manifold-macos-arm64
          path: release-assets/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: Manifold-linux-x86_64
          path: release-assets/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: Manifold-windows-x86_64
          path: release-assets/windows

      - name: Stage release archives and compute SHA256SUMS.txt
        run: |
          mkdir -p dist
          cp release-assets/macos/Manifold-macos-arm64.zip dist/Manifold-macos-arm64.zip
          cp release-assets/linux/manifold-linux.tar.gz dist/Manifold-linux-x86_64.tar.gz
          cp release-assets/windows/manifold-windows-x86_64.zip dist/Manifold-windows-x86_64.zip
          (cd dist && sha256sum Manifold-macos-arm64.zip Manifold-linux-x86_64.tar.gz Manifold-windows-x86_64.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              dist/Manifold-macos-arm64.zip \
              dist/Manifold-linux-x86_64.tar.gz \
              dist/Manifold-windows-x86_64.zip \
              dist/SHA256SUMS.txt \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG_NAME}" \
              dist/Manifold-macos-arm64.zip \
              dist/Manifold-linux-x86_64.tar.gz \
              dist/Manifold-windows-x86_64.zip \
              dist/SHA256SUMS.txt \
              --title "Manifold ${TAG_NAME}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
