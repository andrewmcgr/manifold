[package]
name = "manifold-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/wgpu desktop GUI for the Manifold non-planar slicing engine"

[[bin]]
name = "manifold-gui"
path = "src/main.rs"

[dependencies]
manifold-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
glam = { workspace = true, features = ["bytemuck"] }
rfd = "0.15"
transform-gizmo-egui = "0.4.0"
