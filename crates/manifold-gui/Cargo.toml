[package]
name = "manifold-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/wgpu desktop GUI for the Manifold non-planar slicing engine"

[[bin]]
name = "manifold-gui"
path = "src/main.rs"

[dependencies]
manifold-core.workspace = true
manifold-printer = { path = "../manifold-printer" }
manifold-fidget.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
glam = { workspace = true, features = ["bytemuck"] }
rfd = "0.15"
transform-gizmo-egui = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
# Safe endpoint presentation for drafts as well as active printer targets.
url = "2"

# Phase 9 (ROADMAP.md): dev/test-only MCP automation server, off by default.
rmcp = { version = "0.9", features = ["server", "transport-async-rw"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"], optional = true }
schemars = { version = "1", optional = true }

[features]
mcp-server = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dev-dependencies]
# Reuse the loopback HTTP/WS fixtures for session-retirement regressions.
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.24"
