[package]
name = "manifold-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/wgpu desktop GUI for the Manifold non-planar slicing engine"

[[bin]]
name = "manifold-gui"
path = "src/main.rs"

[dependencies]
manifold-core.workspace = true
manifold-fidget.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
glam = { workspace = true, features = ["bytemuck"] }
rfd = "0.15"
transform-gizmo-egui = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 9 (ROADMAP.md): dev/test-only MCP automation server, off by default.
rmcp = { version = "0.9", features = ["server", "transport-async-rw"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"], optional = true }
schemars = { version = "1", optional = true }

[features]
mcp-server = ["dep:rmcp", "dep:tokio", "dep:schemars"]
