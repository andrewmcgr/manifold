[package]
name = "manifold-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI front-end for the Manifold non-planar slicing engine"

[[bin]]
name = "manifold"
path = "src/main.rs"

[dependencies]
manifold-core.workspace = true
manifold-printer = { path = "../manifold-printer" }
anyhow.workspace = true
clap.workspace = true
glam.workspace = true
indicatif = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Used only by scratch verification examples (e.g.
# verify_wall_gap_stitching) that check slicing output directly against
# the mesh SDF; the `manifold` binary itself never depends on it.
manifold-fidget.workspace = true
serde.workspace = true
# Used only by scratch diagnostic examples (e.g.
# diagnose_missing_overhang) that load a real saved machine+config
# profile.json (the same shape manifold-gui's Profile serializes); the
# `manifold` binary itself never depends on it.
serde_json.workspace = true
# Loopback protocol and subprocess regressions only.
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.24"
tokio = { version = "1", features = ["full"] }
