[workspace]
resolver = "2"
members = [
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Manifold Slicer Contributors"]

[workspace.dependencies]
cxx = "1.0"
cxx-build = "1.0"
cmake = "0.1"
bytemuck = { version = "1.18", features = ["derive", "extern_crate_alloc"] }
wgpu = "0.20"
bevy = "0.14"
bevy_egui = "0.29"
egui = "0.28"
rfd = "0.15"
stl_io = "0.11"
bevy_obj = "0.14"
tobj = "4.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.10"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"
lto = "off"

[profile.test.package."*"]
opt-level = 2
debug = false

