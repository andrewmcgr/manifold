[workspace]
resolver = "2"
members = [
    "crates/manifold-core",
    "crates/manifold-cli",
    "crates/manifold-gui",
    "crates/manifold-fidget",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andrewmcgr/manifold"

[workspace.dependencies]
manifold-core = { path = "crates/manifold-core" }
manifold-fidget = { path = "crates/manifold-fidget" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
lib3mf = { version = "0.1", default-features = false }
stl_io = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1"
i_overlay = { version = "8.0.0", features = ["glam"] }

[profile.release]
lto = true
codegen-units = 1
