[workspace]
resolver = "2"
members = [
    "crates/manifold-core",
    "crates/manifold-cli",
    "crates/manifold-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andrewmcgr/manifold"

[workspace.dependencies]
manifold-core = { path = "crates/manifold-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
